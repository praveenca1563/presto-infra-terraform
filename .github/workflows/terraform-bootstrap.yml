name: Terraform Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

env:
  TF_VERSION: "1.12.1"
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  TF_IN_AUTOMATION: "true"

permissions:
  contents: read

jobs:

  bootstrap-apply:

    name: Bootstrap Azure Infrastructure

    runs-on: windows-latest

    timeout-minutes: 90

    environment: ${{ github.event.inputs.environment || 'dev' }}

    defaults:
      run:
        shell: powershell

    steps:

    ###########################################################
    # Checkout
    ###########################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

    ###########################################################
    # Setup Terraform
    ###########################################################

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    ###########################################################
    # Verify Runner
    ###########################################################

    - name: Verify Runner Environment
      shell: powershell
      run: |

        Write-Host "===================================="
        Write-Host "GitHub Runner Information"
        Write-Host "===================================="

        Write-Host "Runner Name : $env:RUNNER_NAME"
        Write-Host "Runner OS   : $env:RUNNER_OS"
        Write-Host "Runner Arch : $env:RUNNER_ARCH"
        Write-Host "Machine     : $env:COMPUTERNAME"

        Write-Host ""
        write-Host "PATH"
        Write-Host $env:PATH

        write-Host ""
        Write-Host "Terraform Location"
        where.exe terraform

        write-Host ""
        Get-Command terraform | Format-List *

        Write-Host "PowerShell Version"
        $PSVersionTable.PSVersion

        Write-Host ""

        Write-Host "Terraform Version"
        terraform version

        Write-Host ""

        Write-Host "Azure CLI Version"
        az version

        Write-Host ""

        Write-Host "Git Version"
        git --version

        Write-Host ""

        Write-Host "Working Directory"
        Get-Location

    ###########################################################
    # Cache Terraform
    ###########################################################

    - name: Cache Terraform
      uses: actions/cache@v4
      with:
        path: |
          .terraform
        key: terraform-${{ runner.os }}-${{ hashFiles('**/*.tf','**/.terraform.lock.hcl') }}
        restore-keys: |
          terraform-${{ runner.os }}-

    ###########################################################
    # Azure Login
    ###########################################################

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: |
          {
            "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
          }

    ###########################################################
    # Verify Azure Login
    ###########################################################

    - name: Verify Azure Login
      run: |

        Write-Host "===================================="
        Write-Host "Azure Account"
        Write-Host "===================================="

        az account show

    ###########################################################
    # Terraform Init
    ###########################################################

    - name: Terraform Init

      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      run: |

        terraform init `
          -backend-config="environments/${env:ENVIRONMENT}/backend.hcl"

    ###########################################################
    # Terraform Format
    ###########################################################

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    ###########################################################
    # Terraform Validate
    ###########################################################

    - name: Terraform Validate
      run: terraform validate

    ###########################################################
    # Terraform Plan
    ###########################################################

    - name: Terraform Plan

      env:

        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

        TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
        TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}

        TF_VAR_github_owner: ${{ github.repository_owner }}
        TF_VAR_github_token: ${{ secrets.GH_ADMIN_TOKEN }}



      run: |

        terraform plan `
          -var-file="environments/${env:ENVIRONMENT}/terraform.tfvars" `
          -out=tfplan

    ###########################################################
    # Upload Plan
    ###########################################################

    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v4
      with:
        name: bootstrap-plan-${{ env.ENVIRONMENT }}
        path: tfplan
        retention-days: 5

    ###########################################################
    # Terraform Apply
    ###########################################################

    - name: Terraform Apply

      env:

        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

        TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
        TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}

        TF_VAR_github_owner: ${{ github.repository_owner }}
        TF_VAR_github_token: ${{ secrets.GH_ADMIN_TOKEN }}



      run: |

        terraform apply -auto-approve tfplan

    ###########################################################
    # Terraform Outputs
    ###########################################################

    - name: Terraform Output
      run: terraform output